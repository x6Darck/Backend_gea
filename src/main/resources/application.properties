# ===============================
# SERVER
# ===============================
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/api
# Declarados explícitamente (antes dependían del default implícito de Spring Boot,
# 200/100). 150 hilos deja margen de CPU/memoria en un servidor compartido con MySQL
# y coherente con el pool Hikari de 25 conexiones (más hilos que conexiones solo
# generan espera, no throughput adicional).
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:150}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${TOMCAT_CONN_TIMEOUT:20000}


# ===============================
# DATABASE (MySQL)
# ===============================
spring.datasource.url=${}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# ===============================
# CONNECTION POOL (HikariCP)
# ===============================
# Línea base para VM de 8GB (MySQL local, latencia baja). Ajustar según la tabla
# de tuning por RAM del plan de migración (16GB->35, 32GB->50).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:25}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=GEA-HikariPool

# ===============================
# JPA & HIBERNATE
# ===============================
# ATENCION: En produccion usar 'validate' o 'none'. 'update' puede corromper datos.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# FLYWAY (migraciones)
# ===============================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

# ===============================
# SECURITY & CORS
# ===============================
jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000
app.security.cors.allowed-origins=${}
app.security.cookie.secure=${COOKIE_SECURE:false}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.security.cookie.name=gea_auth
app.security.rate-limit.enabled=true
app.security.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:150}
app.security.rate-limit.non-auth-multiplier=${RATE_LIMIT_NON_AUTH_MULTIPLIER:10}
app.security.rate-limit.auth-requests-per-minute=${RATE_LIMIT_AUTH_RPM:300}
app.security.rate-limit.trust-proxy=${RATE_LIMIT_TRUST_PROXY:false}

# ===============================
# MICROSOFT OAUTH (login app móvil, ver MicrosoftAuthServiceImpl)
# ===============================
microsoft.tenant-id=${MICROSOFT_TENANT_ID:}
microsoft.client-id=${MICROSOFT_CLIENT_ID:}
microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:}

# ===============================
# EMAIL (SMTP)
# ===============================
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:CAMBIAR_ESTA_CLAVE_DE_APLICACION}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.notifications.email-enabled=true
app.notifications.university-recipients=${UNIVERSITY_RECIPIENTS:}
app.notifications.published-recipients=${PUBLISHED_RECIPIENTS:}
app.mail.from-name=GEA
app.frontend-base-url=${FRONTEND_URL:}

# ===============================
# FILES
# ===============================
file.upload-dir=${UPLOAD_DIR:uploads/}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.allowed-extensions=jpg,jpeg,png,pdf
file.allowed-content-types=image/jpeg,image/png,application/pdf

# ===============================
# AUDIT (ENVERS)
# ===============================
spring.jpa.properties.hibernate.envers.store_data_at_delete=true
spring.jpa.properties.hibernate.envers.global_with_modified_flag=true
spring.jpa.properties.hibernate.envers.audit_table_suffix=_aud

# ===============================
# DOCUMENTATION (SWAGGER)
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ===============================
# SYSTEM
# ===============================
# spring.main.headless=true

# ===============================
# ASYNC POOL (notificaciones)
# ===============================
app.async.notifications.core-pool-size=${NOTIF_POOL_CORE:3}
app.async.notifications.max-pool-size=${NOTIF_POOL_MAX:12}
app.async.notifications.queue-capacity=${NOTIF_QUEUE_CAPACITY:200}

# ===============================
# ACTUATOR (Health & Metrics)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.server.port=${MANAGEMENT_PORT:8080}
management.health.mail.enabled=false
